<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta de Certificado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-start:    #0f0c29;
      --bg-mid:      #302b63;
      --bg-end:      #24243e;
      --card-bg:     rgba(255 255 255 / 0.07);
      --card-border: rgba(255 255 255 / 0.12);
      --accent:      #a78bfa;
      --accent-glow: rgba(167 139 250 / 0.35);
      --text-main:   #f0eeff;
      --text-muted:  rgba(240 238 255 / 0.55);
      --success:     #34d399;
      --warning:     #fbbf24;
      --danger:      #f87171;
      --radius:      20px;
      --transition:  0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
      background-attachment: fixed;
      color: var(--text-main);
      padding: clamp(1rem, 4vw, 1.5rem);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(167,139,250,0.18), transparent 70%);
      top: -100px; left: -100px;
    }
    body::after {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(99,102,241,0.2), transparent 70%);
      bottom: -80px; right: -80px;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 2.8rem 2.4rem;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.35),
        0 0 0 1px rgba(255,255,255,0.04) inset;
      animation: cardIn 0.6s var(--transition) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }

    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
    .brand-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(1.4); opacity: 0.7; }
    }
    .brand-label {
      font-family: 'Syne', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.4rem, 6vw, 1.9rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .form-group { display: flex; flex-direction: column; gap: 0.75rem; }

    label {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    input[type="text"] {
      width: 100%;
      padding: 1rem 1.25rem;
      font-family: 'Inter', sans-serif;
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--text-main);
      background: rgba(255 255 255 / 0.06);
      border: 1.5px solid rgba(255 255 255 / 0.1);
      border-radius: 12px;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
      letter-spacing: 0.04em;
    }
    input[type="text"]::placeholder { color: rgba(255 255 255 / 0.25); }
    input[type="text"]:focus {
      border-color: var(--accent);
      background: rgba(167 139 250 / 0.08);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    button#btn-consultar {
      margin-top: 0.25rem;
      width: 100%;
      padding: 1rem;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.45);
    }
    button#btn-consultar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
      opacity: 0;
      transition: opacity var(--transition);
    }
    button#btn-consultar:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(124, 58, 237, 0.55);
    }
    button#btn-consultar:hover:not(:disabled)::before { opacity: 1; }
    button#btn-consultar:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.4);
    }
    button#btn-consultar:disabled { opacity: 0.55; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 22px; height: 22px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-text { display: block; }

    #resultado {
      margin-top: 1.8rem;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.45s ease, transform 0.45s ease;
      pointer-events: none;
    }
    #resultado.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .divider {
      border: none;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
      margin-bottom: 1.5rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
      margin-bottom: 1rem;
    }
    .stat-box {
      background: rgba(255 255 255 / 0.05);
      border: 1px solid rgba(255 255 255 / 0.08);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }
    .stat-box.full { grid-column: 1 / -1; }
    .stat-box .stat-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }
    .stat-box .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
      overflow-wrap: anywhere;
    }

    /* Estado del certificado */
    .cert-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 1.1rem 1rem;
      border-radius: 14px;
      text-align: center;
    }
    .cert-badge .cert-icon { font-size: 1.8rem; line-height: 1; }
    .cert-badge .cert-title {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .cert-badge .cert-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }
    .cert-badge.success { background: rgba(52,211,153,0.12);  color: var(--success); border: 1px solid rgba(52,211,153,0.25); }
    .cert-badge.danger  { background: rgba(248,113,113,0.12); color: var(--danger);  border: 1px solid rgba(248,113,113,0.25); }

    .error-msg {
      text-align: center;
      padding: 1rem;
      border-radius: 10px;
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.25);
      color: var(--danger);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .input-error { border-color: var(--danger) !important; box-shadow: 0 0 0 3px rgba(248,113,113,0.2) !important; }
    .hint { font-size: 0.78rem; color: var(--danger); margin-top: 0.25rem; display: none; }
    .hint.show { display: block; }

    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.72rem;
      color: rgba(255 255 255 / 0.2);
      letter-spacing: 0.05em;
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="card" role="main">

    <div class="brand">
      <div class="brand-dot" aria-hidden="true"></div>
      <span class="brand-label">Sistema de Certificados</span>
    </div>

    <h1>Consulta tu<br>certificado</h1>
    <p class="subtitle">Ingresa tu Registro Universitario (RU) para verificar<br>si tienes certificado de bautizo.</p>

    <div class="form-group">
      <label for="input-ru">Registro Universitario (RU)</label>
      <input
        type="text"
        id="input-ru"
        placeholder="Ej. 12345"
        maxlength="12"
        autocomplete="off"
        inputmode="numeric"
        aria-describedby="hint-ru"
      />
      <span class="hint" id="hint-ru" role="alert">Por favor ingresa tu RU antes de consultar.</span>

      <button id="btn-consultar" aria-live="polite">
        <span class="btn-text">Consultar</span>
        <div class="spinner" aria-label="Cargando..." role="status"></div>
      </button>
    </div>

    <div id="resultado" aria-live="polite" aria-atomic="true"></div>

    <p class="footer">© 2026 · CEIE</p>
  </div>

  <script>
    /* -------------------------------------------------------
       API — Apps Script de la NUEVA lista de bautizados.
       Reemplaza esta URL por la de tu nueva implementación.
    ------------------------------------------------------- */
    const API_URL = 'https://script.google.com/macros/s/AKfycbyHcO40BCSFJOW24Kq3mVs4dAVBc9esSM6dpBHiP0UWlNBKFQXs4tIhz0U5OtVlcssb/exec';

    const inputRU    = document.getElementById('input-ru');
    const btnConsult = document.getElementById('btn-consultar');
    const btnText    = btnConsult.querySelector('.btn-text');
    const spinner    = btnConsult.querySelector('.spinner');
    const resultado  = document.getElementById('resultado');
    const hintRU     = document.getElementById('hint-ru');

    function setLoading(active) {
      btnConsult.disabled = active;
      btnText.style.display = active ? 'none'  : 'block';
      spinner.style.display = active ? 'block' : 'none';
    }

    function showResultado(html) {
      resultado.innerHTML = html;
      resultado.classList.remove('visible');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => resultado.classList.add('visible'));
      });
    }

    function clearInputError() {
      inputRU.classList.remove('input-error');
      hintRU.classList.remove('show');
    }

    /** Evita inyectar HTML desde los datos de la hoja */
    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /** Acepta true, "SI", "SÍ", "1", "TRUE", "CERTIFICADO", etc. */
    function tieneCertificado(valor) {
      if (valor === true) return true;
      const v = String(valor ?? '').trim().toUpperCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      return ['SI', 'TRUE', '1', 'X', 'CERTIFICADO', 'TIENE'].includes(v);
    }

    /* -------------------------------------------------------
       Resultado: estudiante encontrado en la lista
    ------------------------------------------------------- */
    function renderResult(data) {
      const ok = tieneCertificado(data.certificado);
      const nombreCompleto = `${data.nombre ?? ''} ${data.apellido ?? ''}`.trim();

      const badge = ok
        ? `<div class="cert-badge success" role="status">
             <span class="cert-icon" aria-hidden="true">✓</span>
             <span class="cert-title">Tienes certificado</span>
             <span class="cert-desc">Tu certificado de bautizo está registrado.</span>
           </div>`
        : `<div class="cert-badge danger" role="status">
             <span class="cert-icon" aria-hidden="true">✗</span>
             <span class="cert-title">Sin certificado</span>
             <span class="cert-desc">Figuras en la lista, pero aún no tienes certificado registrado.</span>
           </div>`;

      showResultado(`
        <hr class="divider" />
        <div class="stats-grid">
          <div class="stat-box full">
            <div class="stat-label">Estudiante</div>
            <div class="stat-value">${esc(nombreCompleto) || '—'}</div>
          </div>
          <div class="stat-box full">
            <div class="stat-label">RU</div>
            <div class="stat-value">${esc(data.ru)}</div>
          </div>
        </div>
        ${badge}
      `);
    }

    function renderNotFound() {
      showResultado(`
        <hr class="divider" />
        <div class="cert-badge danger" role="status">
          <span class="cert-icon" aria-hidden="true">✗</span>
          <span class="cert-title">RU no encontrado</span>
          <span class="cert-desc">Este RU no figura en la lista de bautizados. Verifica el número e intenta de nuevo.</span>
        </div>
      `);
    }

    function renderError(msg) {
      showResultado(`<hr class="divider" /><div class="error-msg">${esc(msg)}</div>`);
    }

    /* -------------------------------------------------------
       Consulta a la API
    ------------------------------------------------------- */
    async function consultarCertificado() {
      const ru = inputRU.value.trim();

      if (!ru) {
        inputRU.classList.add('input-error');
        hintRU.classList.add('show');
        inputRU.focus();
        return;
      }

      clearInputError();
      setLoading(true);

      try {
        const response = await fetch(`${API_URL}?ru=${encodeURIComponent(ru)}&lista=bautizados`);
        const data = await response.json();

        if (data.error) {
          if (data.status === 404) {
            renderNotFound();
          } else {
            renderError('⚠ Error del servidor: ' + data.error);
          }
          return;
        }

        renderResult(data);

      } catch (err) {
        console.error('[Certificado] Error al consultar:', err);
        renderError('⚠ No se pudo conectar al servidor. Intenta más tarde.');
      } finally {
        setLoading(false);
      }
    }

    btnConsult.addEventListener('click', consultarCertificado);
    inputRU.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') consultarCertificado();
    });
    inputRU.addEventListener('input', clearInputError);
  </script>

</body>
</html>
